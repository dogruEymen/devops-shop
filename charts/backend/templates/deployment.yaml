apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - /bin/sh
            - -c
        
          args:
            - |
              mkdir -p /www
              echo {{ .Values.responseMessage | quote }} > /www/index.html
              httpd -f -p {{ .Values.containerPort }} -h /www
            
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}