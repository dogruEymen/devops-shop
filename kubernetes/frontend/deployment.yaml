apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: devops-shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config

          configMap:
            name: frontend-nginx-config